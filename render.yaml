services:
  - type: web
    name: voiceshield-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://voiceshield-frontend-ten.vercel.app
      - key: FRONTEND_URL
        value: https://voiceshield-frontend-ten.vercel.app

databases:
  - name: voiceshield-db
    plan: free
    databaseName: voiceshield
